
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCatalogo - Catálogo de Filmes</title>
    <style>
        /* CONFIGURAÇÕES GERAIS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        :root {
            --bg-body: #111;
            --bg-card: #1c1c1c;
            --primary: #e50914;
            /* Vermelho estilo streaming */
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 4rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* CABEÇALHO */
        header {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* FILTROS E BUSCA */
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid #333;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        /* GRADE DE FILMES */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .movie-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(229, 9, 20, 0.2);
        }

        /* Espaço reservado para a imagem de capa */
        .movie-poster {
            width: 100%;
            height: 320px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            padding: 1rem;
            position: relative;
        }

        .movie-info {
            padding: 1.2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        .rating {
            color: #ffb81c;
            /* Amarelo ouro para nota */
            font-weight: bold;
        }

        .tag {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }

            .movie-poster {
                height: 240px;
            }
        }
    </style>
</head>
